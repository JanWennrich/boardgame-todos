# Local Redis for `npm run dev`, reachable through the Upstash REST API like in production.
services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  redis-http:
    image: hiett/serverless-redis-http:latest
    depends_on:
      - redis
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: local
      SRH_CONNECTION_STRING: redis://redis:6379

volumes:
  redis-data:
